plugins {
    id 'java'
    id 'application'
}

group = 'dev.cobra'
version = '1.0.0'

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.google.code.gson:gson:2.11.0'
    // WebP decoding for Modrinth icons (Java's ImageIO can't read WebP)
    implementation 'com.twelvemonkeys.imageio:imageio-webp:3.12.0'
}

application {
    mainClass = 'dev.cobra.launcher.CobraLauncher'
    applicationDefaultJvmArgs = ['--add-opens=java.desktop/sun.awt.X11=ALL-UNNAMED']
}

// Bundle the Cobra Client mod (built separately by client/gradlew build; build-appimage.sh does
// it for you) so the launcher can install it into each profile.
// The cosmetics' 3D models are shared with Cobra Client (common/): copied in so the launcher can
// show real previews of them.
def cosmeticsSrc = layout.buildDirectory.dir('generated/cosmetics')
tasks.register('copyCosmetics', Copy) {
    from(rootProject.file('common/src/main/java')) { include 'dev/cobra/client/core/cosmetics/**' }
    into(cosmeticsSrc)
}
sourceSets.main.java.srcDir(cosmeticsSrc)
tasks.named('compileJava') { dependsOn 'copyCosmetics' }

// Sky packs for the Sky module: put .zip packs in packaging/skies/ (only ones you may share) and
// they're bundled; an index lists them for the launcher.
def skyDir = rootProject.file('packaging/skies')
def skyIndex = layout.buildDirectory.file('generated/skies/bundled/skies/index.txt')
tasks.register('skyIndex') {
    inputs.dir(skyDir).optional()
    outputs.file(skyIndex)
    doLast {
        def f = skyIndex.get().asFile
        f.parentFile.mkdirs()
        f.text = (skyDir.exists() ? skyDir.listFiles().findAll { it.name.toLowerCase().endsWith('.zip') }*.name : []).join('\n')
    }
}

tasks.named('processResources', ProcessResources) {
    dependsOn 'skyIndex'
    from(layout.buildDirectory.dir('generated/skies'))
    from(skyDir) {
        include '*.zip'
        into 'bundled/skies'
    }
    from(rootProject.file('client/build/libs')) {
        include 'cobra-client-*-*.jar'                           // one per Minecraft version that built
        exclude '*-sources.jar', '*-dev.jar'
        into 'bundled'
        rename { String n -> n.replaceAll(/^cobra-client-(.+)-[^-]+\.jar$/, 'cobra-client-$1.jar') }
    }
}

tasks.named('jar', Jar) {
    archiveFileName = 'cobra-launcher.jar'
    manifest {
        attributes('Main-Class': 'dev.cobra.launcher.CobraLauncher', 'Add-Opens': 'java.desktop/sun.awt.X11')
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class', 'META-INF/versions/*/module-info.class'
}
