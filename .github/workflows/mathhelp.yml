name: mathhelp
on:
  push:
    paths: ['mathhelp/**', '.github/workflows/mathhelp.yml']
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
        working-directory: mathhelp/server
      - uses: actions/upload-artifact@v4
        with: { name: mathhelp-server-linux-x86_64, path: mathhelp/server/target/release/mathhelp }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew assembleRelease
        working-directory: mathhelp/android
      - uses: actions/upload-artifact@v4
        with: { name: mathhelp-apk, path: mathhelp/android/build/outputs/apk/release/*.apk }
