# Builds both downloads on GitHub's machines whenever you push (or press "Run workflow"):
#   LifeLauncher-linux   -> LifeLauncher-x86_64.AppImage (+ life-launcher.jar used for updates)
#   LifeLauncher-windows -> installer "Life Launcher-<version>.exe" + portable zip
# Get them from the repo's Actions tab → the latest run → Artifacts.
#
# Run it with publish = true (the launcher's "Publish update" button does that) and it also makes a
# GitHub Release. Every launcher checks the latest release and updates itself on its next start.
name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: Release this build to everyone (auto-update)
        type: boolean
        default: false

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build number and repo for the updater
        run: printf 'repo=%s\nbuild=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" > launcher/src/main/resources/update.properties
      - name: Tools for the AppImage
        run: sudo apt-get update && sudo apt-get install -y libfuse2 zsync
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          KEEP_UPDATE_PROPERTIES: '1'
        run: |
          chmod +x build-appimage.sh gradlew client/gradlew
          ./build-appimage.sh
          cp launcher/build/libs/life-launcher.jar .
      - uses: actions/upload-artifact@v5
        with:
          name: LifeLauncher-linux
          path: |
            LifeLauncher-x86_64.AppImage
            life-launcher.jar
            build/client-errors.txt
          if-no-files-found: warn

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build number and repo for the updater
        shell: bash
        run: printf 'repo=%s\nbuild=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_RUN_NUMBER" > launcher/src/main/resources/update.properties
      - name: Inno Setup (for the one-file installer .exe)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe") -and -not (Test-Path "$env:ProgramFiles\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows app
        shell: cmd
        run: call build-windows.bat
      - name: Zip the portable app too
        shell: pwsh
        run: Compress-Archive -Path "dist/Life Launcher" -DestinationPath "dist/Life-Launcher-portable.zip"
      - uses: actions/upload-artifact@v5
        with:
          name: LifeLauncher-windows
          path: |
            dist/*.exe
            dist/Life-Launcher-portable.zip

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: out
      - name: Publish the release (launchers update from this)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          # never ship a launcher without Life Client inside
          if ! unzip -l out/LifeLauncher-linux/life-launcher.jar | grep "bundled/life-client-1.21.11.jar" >/dev/null; then
            echo "::error::Life Client didn't build, so nothing was published. See build/client-errors.txt in the linux artifact."
            exit 1
          fi
          # launchers installed before the rename look for the update under their old file name:
          # this copy lets them update to Life once. Delete these two lines when everyone is on Life.
          cp out/LifeLauncher-linux/life-launcher.jar out/cobra-launcher.jar
          files=(out/LifeLauncher-linux/LifeLauncher-x86_64.AppImage out/LifeLauncher-linux/life-launcher.jar out/cobra-launcher.jar out/LifeLauncher-windows/*.exe out/LifeLauncher-windows/*.zip)
          gh release create "b${GITHUB_RUN_NUMBER}" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --title "Life Launcher build ${GITHUB_RUN_NUMBER}" \
            --notes "Everyone's launcher updates to this the next time it's opened."
