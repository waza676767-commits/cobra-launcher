name: messenger
on:
  push:
    paths: ['messenger/**', '.github/workflows/messenger.yml']
  workflow_dispatch:
jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --release
        working-directory: messenger/server
      - uses: actions/upload-artifact@v4
        with: { name: msgd-linux-x86_64, path: messenger/server/target/release/msgd }
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: ./gradlew assembleRelease
        working-directory: messenger/android
      - uses: actions/upload-artifact@v4
        with: { name: tinymsg-apk, path: messenger/android/build/outputs/apk/release/*.apk }
